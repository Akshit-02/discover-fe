<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Five-step process for finding finance influencers in India: define the product and regulator, find creators through search, communities and filters, verify registrations and qualifications, screen past content for misleading claims, then brief with approved claims and disclosures</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Finding finance influencers in India</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Five steps from regulator to shortlist, with credentials and claims checked before you brief.</text>
<g fill="#202124" font-size="16">
<rect x="80" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="100" y="232" font-size="20" font-weight="700">1 Product + regulator</text>
<text x="100" y="290" opacity=".8">SEBI, IRDAI or RBI-</text>
<text x="100" y="314" opacity=".8">regulated partner?</text>
<text x="100" y="356" opacity=".8">Audience life stage,</text>
<text x="100" y="380" opacity=".8">cities and language</text>
<rect x="372" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="372" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="392" y="232" font-size="20" font-weight="700">2 Find creators</text>
<text x="392" y="290" opacity=".8">Buyer-question search</text>
<text x="392" y="314" opacity=".8">in English and regional</text>
<text x="392" y="338" opacity=".8">languages</text>
<text x="392" y="380" opacity=".8">Competitor tags, CA</text>
<text x="392" y="404" opacity=".8">communities, niche and</text>
<text x="392" y="428" opacity=".8">city filters</text>
<rect x="665" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="665" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="685" y="232" font-size="20" font-weight="700">3 Verify credentials</text>
<text x="685" y="290" opacity=".8">SEBI registration no.</text>
<text x="685" y="314" opacity=".8">for securities advice</text>
<text x="685" y="356" opacity=".8">CA, CS, insurance</text>
<text x="685" y="380" opacity=".8">licence or ARN, with</text>
<text x="685" y="404" opacity=".8">date verified</text>
<rect x="957" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="957" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="977" y="232" font-size="20" font-weight="700">4 Screen claims</text>
<text x="977" y="290" opacity=".8">Guaranteed returns</text>
<text x="977" y="314" opacity=".8">Get-rich-quick framing</text>
<text x="977" y="338" opacity=".8">Stock tips and calls</text>
<text x="977" y="362" opacity=".8">P&amp;L screenshots</text>
<text x="977" y="404" opacity=".8">Disclosure habits</text>
<rect x="1250" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1250" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1270" y="232" font-size="20" font-weight="700">5 Brief responsibly</text>
<text x="1270" y="290" opacity=".8">Approved claims and</text>
<text x="1270" y="314" opacity=".8">banned claims list</text>
<text x="1270" y="356" opacity=".8">Ad label, credential</text>
<text x="1270" y="380" opacity=".8">display, review time,</text>
<text x="1270" y="404" opacity=".8">two or three backups</text>
<rect x="80" y="528" width="1440" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="104" y="568" font-size="18" font-weight="700">ASCI, Aug 2023: stock and investment influencers should be SEBI-registered and show the number.</text>
<text x="104" y="598" opacity=".75">SEBI, Oct 2024: regulated entities must not associate with unregistered persons giving securities advice or return claims.</text>
</g>
<text x="80" y="672" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
