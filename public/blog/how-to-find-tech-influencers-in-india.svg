<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Four-step process for finding tech influencers in India: pick the product category, match the creator type (reviewer, educator or enthusiast), check technical credibility and audience relevance, then plan review units, embargo and disclosure</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Finding tech influencers in India</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">From product category to a launch-ready shortlist of technology creators.</text>
<g fill="#202124" font-size="20">
<rect x="80" y="196" width="320" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="196" width="320" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="102" y="230" font-weight="700">1 Pick the category</text>
<text x="102" y="290" font-size="17" opacity=".8">Mobiles</text>
<text x="102" y="322" font-size="17" opacity=".8">Laptops and tablets</text>
<text x="102" y="354" font-size="17" opacity=".8">Audio</text>
<text x="102" y="386" font-size="17" opacity=".8">Gaming</text>
<text x="102" y="418" font-size="17" opacity=".8">Wearables, smart home</text>
<text x="102" y="450" font-size="17" opacity=".8">Accessories</text>
<rect x="440" y="196" width="320" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="440" y="196" width="320" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="462" y="230" font-weight="700">2 Match creator type</text>
<text x="462" y="290" font-size="17" font-weight="700">Reviewers</text>
<text x="462" y="314" font-size="16" opacity=".75">tests, comparisons, verdicts</text>
<text x="462" y="354" font-size="17" font-weight="700">Educators</text>
<text x="462" y="378" font-size="16" opacity=".75">explainers, how-tos</text>
<text x="462" y="418" font-size="17" font-weight="700">Enthusiasts</text>
<text x="462" y="442" font-size="16" opacity=".75">setups, finds, demos</text>
<rect x="800" y="196" width="320" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="800" y="196" width="320" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="822" y="230" font-weight="700">3 Check fit</text>
<text x="822" y="290" font-size="17" opacity=".8">Accurate specs, real testing</text>
<text x="822" y="322" font-size="17" opacity=".8">Balanced sponsored verdicts</text>
<text x="822" y="354" font-size="17" opacity=".8">Recent average views</text>
<text x="822" y="386" font-size="17" opacity=".8">Buying questions in comments</text>
<text x="822" y="418" font-size="17" opacity=".8">Audience shops your category</text>
<rect x="1160" y="196" width="360" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1160" y="196" width="360" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1182" y="230" font-weight="700">4 Plan the review</text>
<text x="1182" y="290" font-size="17" opacity=".8">Review unit: gift or loan</text>
<text x="1182" y="322" font-size="17" opacity=".8">Return date and pickup</text>
<text x="1182" y="354" font-size="17" opacity=".8">Testing time before embargo</text>
<text x="1182" y="386" font-size="17" opacity=".8">Embargo date in writing</text>
<text x="1182" y="418" font-size="17" opacity=".8">Ad label, upfront disclosure</text>
<rect x="80" y="530" width="1440" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="102" y="568" font-weight="700">Relevant beats large</text>
<text x="102" y="600" font-size="17" opacity=".8">1.2M general tech followers vs 85K audio-focused followers for ₹4,999 earbuds: the smaller audience is already shopping. (Illustrative)</text>
</g>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
