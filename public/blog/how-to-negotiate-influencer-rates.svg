<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Six steps to negotiate influencer rates: fix the scope, compare creators, ask for an itemised quote, price usage rights, discuss exclusivity separately, and agree payment terms in writing, with the levers to use when a quote is over budget</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Negotiating influencer rates</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Change the scope, not the creator's worth. Price each part of the deal separately.</text>
<g fill="#202124" font-size="20">
<rect x="80" y="190" width="224" height="200" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<text x="100" y="230" font-weight="700">1 Fix the scope</text>
<text x="100" y="266" font-size="16" opacity=".75">Formats, counts,</text>
<text x="100" y="290" font-size="16" opacity=".75">dates, revisions</text>
<rect x="324" y="190" width="224" height="200" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<text x="344" y="230" font-weight="700">2 Compare</text>
<text x="344" y="266" font-size="16" opacity=".75">Average views and</text>
<text x="344" y="290" font-size="16" opacity=".75">engagement of 2-3</text>
<text x="344" y="314" font-size="16" opacity=".75">similar creators</text>
<rect x="568" y="190" width="224" height="200" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<text x="588" y="230" font-weight="700">3 Itemised quote</text>
<text x="588" y="266" font-size="16" opacity=".75">Content + rights +</text>
<text x="588" y="290" font-size="16" opacity=".75">exclusivity as</text>
<text x="588" y="314" font-size="16" opacity=".75">separate lines</text>
<rect x="812" y="190" width="224" height="200" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<text x="832" y="230" font-weight="700">4 Usage rights</text>
<text x="832" y="266" font-size="16" opacity=".75">Organic, paid ads,</text>
<text x="832" y="290" font-size="16" opacity=".75">website; duration</text>
<text x="832" y="314" font-size="16" opacity=".75">and territory</text>
<rect x="1056" y="190" width="224" height="200" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<text x="1076" y="230" font-weight="700">5 Exclusivity</text>
<text x="1076" y="266" font-size="16" opacity=".75">Named competitors,</text>
<text x="1076" y="290" font-size="16" opacity=".75">dated window,</text>
<text x="1076" y="314" font-size="16" opacity=".75">own price</text>
<rect x="1300" y="190" width="220" height="200" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1320" y="230" font-weight="700">6 Put it in writing</text>
<text x="1320" y="266" font-size="16">Advance %, balance</text>
<text x="1320" y="290" font-size="16">after go-live,</text>
<text x="1320" y="314" font-size="16">invoice, disclosure</text>
<rect x="80" y="430" width="1440" height="200" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="430" width="1440" height="52" fill="#FFF7F1" stroke="#202124" stroke-width="3"/>
<text x="104" y="464" font-weight="700">QUOTE OVER BUDGET? PULL A LEVER INSTEAD OF PRESSING FOR A DISCOUNT</text>
<rect x="104" y="506" width="262" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="124" y="546" font-weight="700">Fewer deliverables</text>
<text x="124" y="576" font-size="16" opacity=".75">1 Reel + 2 Stories</text>
<rect x="386" y="506" width="262" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="406" y="546" font-weight="700">Shorter ad usage</text>
<text x="406" y="576" font-size="16" opacity=".75">30 days, not 90</text>
<rect x="668" y="506" width="262" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="688" y="546" font-weight="700">Narrower exclusivity</text>
<text x="688" y="576" font-size="16" opacity=".75">Named rivals only</text>
<rect x="950" y="506" width="262" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="970" y="546" font-weight="700">Flexible timeline</text>
<text x="970" y="576" font-size="16" opacity=".75">Two-week window</text>
<rect x="1232" y="506" width="264" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="1252" y="546" font-weight="700">Bundle posts</text>
<text x="1252" y="576" font-size="16" opacity=".75">Package price</text>
</g>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
