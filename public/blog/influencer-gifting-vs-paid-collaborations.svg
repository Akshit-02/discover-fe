<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Comparison of three influencer collaboration models: unconditional gifting with no obligation to post, barter with agreed deliverables in exchange for product, and paid collaborations with a fee, contract and usage rights, plus the combined approach of gifting widely and paying the best performers</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Gifting, barter or paid?</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Three models, one question: how much certainty and control do you need?</text>
<g fill="#202124" font-size="20">
<rect x="80" y="186" width="440" height="330" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="186" width="440" height="52" fill="#FFF7F1" stroke="#202124" stroke-width="3"/>
<text x="104" y="220" font-weight="700">1 Unconditional gifting</text>
<text x="104" y="280" font-size="17" opacity=".8">You give: product, shipping</text>
<text x="104" y="310" font-size="17" opacity=".8">Creator owes: nothing</text>
<text x="104" y="340" font-size="17" opacity=".8">Certainty: low</text>
<text x="104" y="370" font-size="17" opacity=".8">Control: very little</text>
<text x="104" y="400" font-size="17" opacity=".8">Authenticity: highest</text>
<text x="104" y="470" font-size="17" font-weight="700">Best for: testing fit,</text>
<text x="104" y="496" font-size="17" font-weight="700">finding advocates</text>
<rect x="580" y="186" width="440" height="330" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="580" y="186" width="440" height="52" fill="#FFF7F1" stroke="#202124" stroke-width="3"/>
<text x="604" y="220" font-weight="700">2 Barter</text>
<text x="604" y="280" font-size="17" opacity=".8">You give: product or experience</text>
<text x="604" y="310" font-size="17" opacity=".8">Creator owes: agreed content</text>
<text x="604" y="340" font-size="17" opacity=".8">Certainty: medium</text>
<text x="604" y="370" font-size="17" opacity=".8">Control: format, window</text>
<text x="604" y="400" font-size="17" opacity=".8">Terms: in writing</text>
<text x="604" y="470" font-size="17" font-weight="700">Best for: small creators,</text>
<text x="604" y="496" font-size="17" font-weight="700">high-value products</text>
<rect x="1080" y="186" width="440" height="330" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1080" y="186" width="440" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1104" y="220" font-weight="700">3 Paid collaboration</text>
<text x="1104" y="280" font-size="17" opacity=".8">You give: fee (+ product)</text>
<text x="1104" y="310" font-size="17" opacity=".8">Creator owes: contracted work</text>
<text x="1104" y="340" font-size="17" opacity=".8">Certainty: high</text>
<text x="1104" y="370" font-size="17" opacity=".8">Control: brief, dates, review</text>
<text x="1104" y="400" font-size="17" opacity=".8">Usage rights: negotiable</text>
<text x="1104" y="470" font-size="17" font-weight="700">Best for: launches, sales,</text>
<text x="1104" y="496" font-size="17" font-weight="700">ad creative</text>
<rect x="80" y="546" width="1440" height="80" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="104" y="580" font-weight="700">Combine them:</text>
<text x="260" y="580" font-size="18">gift wide  →  review who posted and how audiences reacted  →  pay the best performers</text>
<text x="104" y="608" font-size="16" opacity=".7">All three need clear disclosure in India (ASCI: free products are a material connection).</text>
</g>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
