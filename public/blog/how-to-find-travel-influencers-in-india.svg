<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Four-step process for finding travel influencers in India: match the creator type to your property, search by destination and by the source market your guests come from, check honest reviews, practical detail and audience location, then agree a written stay with disclosure and booking tracking</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Finding travel influencers in India</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">For hotels, resorts, homestays, tour operators and destinations.</text>
<g fill="#202124" font-size="20">
<rect x="80" y="190" width="332" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="190" width="332" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="102" y="226" font-weight="700">1 Match the creator type</text>
<text x="102" y="286" font-size="17" opacity=".8">Luxury, budget, family</text>
<text x="102" y="318" font-size="17" opacity=".8">Adventure, road-trip</text>
<text x="102" y="350" font-size="17" opacity=".8">Food-travel, photographers</text>
<text x="102" y="382" font-size="17" opacity=".8">Regional state explorers</text>
<text x="102" y="440" font-size="16" opacity=".6">Fit your tariff and</text>
<text x="102" y="464" font-size="16" opacity=".6">the trip you sell</text>
<rect x="448" y="190" width="332" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="448" y="190" width="332" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="470" y="226" font-weight="700">2 Search two ways</text>
<text x="470" y="286" font-size="17" opacity=".8">Destination: tags, landmarks,</text>
<text x="470" y="318" font-size="17" opacity=".8">similar properties' posts</text>
<text x="470" y="350" font-size="17" opacity=".8">Source market: creators in</text>
<text x="470" y="382" font-size="17" opacity=".8">your guests' home cities</text>
<text x="470" y="440" font-size="16" opacity=".6">Filters: Travel niche, state,</text>
<text x="470" y="464" font-size="16" opacity=".6">city, language, avg views</text>
<rect x="816" y="190" width="332" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="816" y="190" width="332" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="838" y="226" font-weight="700">3 Evaluate</text>
<text x="838" y="286" font-size="17" opacity=".8">Honest reviews</text>
<text x="838" y="318" font-size="17" opacity=".8">Prices, season, how to reach</text>
<text x="838" y="350" font-size="17" opacity=".8">Reels vs carousels</text>
<text x="838" y="382" font-size="17" opacity=".8">Recent average views</text>
<text x="838" y="440" font-size="16" opacity=".6">Audience: top-cities</text>
<text x="838" y="464" font-size="16" opacity=".6">insights screenshot</text>
<rect x="1184" y="190" width="336" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1184" y="190" width="336" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1206" y="226" font-weight="700">4 Agree the stay</text>
<text x="1206" y="286" font-size="17" opacity=".8">Dates, meals, guests</text>
<text x="1206" y="318" font-size="17" opacity=".8">Deliverables, usage rights</text>
<text x="1206" y="350" font-size="17" opacity=".8">Plan for a bad experience</text>
<text x="1206" y="382" font-size="17" opacity=".8">Disclose even a free stay</text>
<text x="1206" y="440" font-size="16" opacity=".6">Track: booking codes,</text>
<text x="1206" y="464" font-size="16" opacity=".6">direct links, enquiries</text>
</g>
<g stroke="#202124" stroke-width="3" fill="none">
<path d="M416 340h28M436 332l8 8-8 8"/>
<path d="M784 340h28M804 332l8 8-8 8"/>
<path d="M1152 340h28M1172 332l8 8-8 8"/>
</g>
<rect x="80" y="526" width="1440" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="104" y="566" font-size="18" font-weight="700" fill="#202124">Hypothetical fits</text>
<text x="104" y="598" font-size="17" fill="#202124" opacity=".75">Coorg homestay: Bengaluru weekend creators · Goa villa in monsoon: Mumbai road-trippers · Meghalaya tours: NE explorers</text>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
