<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Five-step process for finding fitness influencers in India: pick the niche and audience, find creators through search, communities and filters, check form and credentials, screen for misleading claims, then shortlist with a written brief</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Finding fitness influencers in India</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Five steps from niche to shortlist, with credibility and claims checked before you brief.</text>
<g fill="#202124" font-size="16">
<rect x="80" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="100" y="232" font-size="20" font-weight="700">1 Pick the niche</text>
<text x="100" y="290" opacity=".8">Gym, home workouts,</text>
<text x="100" y="314" opacity=".8">yoga, running, sports</text>
<text x="100" y="338" opacity=".8">nutrition or wellness</text>
<text x="100" y="380" opacity=".8">Beginners or athletes,</text>
<text x="100" y="404" opacity=".8">cities and language</text>
<rect x="372" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="372" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="392" y="232" font-size="20" font-weight="700">2 Find creators</text>
<text x="392" y="290" opacity=".8">Problem-led search in</text>
<text x="392" y="314" opacity=".8">English and regional</text>
<text x="392" y="338" opacity=".8">languages</text>
<text x="392" y="380" opacity=".8">Gyms, studios, running</text>
<text x="392" y="404" opacity=".8">clubs, competitor tags,</text>
<text x="392" y="428" opacity=".8">niche and city filters</text>
<rect x="665" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="665" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="685" y="232" font-size="20" font-weight="700">3 Check credibility</text>
<text x="685" y="290" opacity=".8">Form and technique</text>
<text x="685" y="314" opacity=".8">across several videos</text>
<text x="685" y="356" opacity=".8">Qualifications with</text>
<text x="685" y="380" opacity=".8">proof, audience fit,</text>
<text x="685" y="404" opacity=".8">real comments</text>
<rect x="957" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="957" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="977" y="232" font-size="20" font-weight="700">4 Screen claims</text>
<text x="977" y="290" opacity=".8">Transformation photos</text>
<text x="977" y="314" opacity=".8">Guaranteed results</text>
<text x="977" y="338" opacity=".8">Supplement and cure</text>
<text x="977" y="362" opacity=".8">claims</text>
<text x="977" y="404" opacity=".8">Disclosure habits</text>
<rect x="1250" y="196" width="270" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1250" y="196" width="270" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1270" y="232" font-size="20" font-weight="700">5 Shortlist</text>
<text x="1270" y="290" opacity=".8">Brief with a claims list</text>
<text x="1270" y="314" opacity=".8">and disclosure label</text>
<text x="1270" y="356" opacity=".8">Insights screenshots,</text>
<text x="1270" y="380" opacity=".8">quotes on one scope,</text>
<text x="1270" y="404" opacity=".8">two or three backups</text>
<rect x="80" y="528" width="1440" height="96" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="104" y="568" font-size="18" font-weight="700">ASCI, Aug 2023: health and nutrition advice needs relevant qualifications, shown upfront.</text>
<text x="104" y="598" opacity=".75">Doctor, nurse, nutritionist, dietician, physiotherapist or psychologist, depending on the advice given.</text>
</g>
<text x="80" y="672" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
