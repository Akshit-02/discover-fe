<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Five-step audience matching process for Instagram creators: write an audience statement, check content and niche relevance, check location and language, read views and comments, then score each creator on a relevance rubric</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Match creators to your audience, not follower count</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Five checks that turn an Instagram influencer search into a relevance-based shortlist.</text>
<g fill="#202124" font-size="16">
<rect x="80" y="196" width="264" height="250" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="196" width="264" height="48" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="100" y="228" font-size="20" font-weight="700">1 Audience</text>
<text x="100" y="282" opacity=".75">Who buys, which</text>
<text x="100" y="306" opacity=".75">cities, languages,</text>
<text x="100" y="330" opacity=".75">interests, price</text>
<text x="100" y="354" opacity=".75">and channel</text>
<text x="100" y="412" font-weight="700">One-paragraph</text>
<text x="100" y="434" font-weight="700">statement</text>
<rect x="374" y="196" width="264" height="250" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="374" y="196" width="264" height="48" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="394" y="228" font-size="20" font-weight="700">2 Content</text>
<text x="394" y="282" opacity=".75">Read the last 15–20</text>
<text x="394" y="306" opacity=".75">posts: topic share,</text>
<text x="394" y="330" opacity=".75">use case, price</text>
<text x="394" y="354" opacity=".75">level, format</text>
<text x="394" y="412" font-weight="700">Niche label is</text>
<text x="394" y="434" font-weight="700">only a start</text>
<rect x="668" y="196" width="264" height="250" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="668" y="196" width="264" height="48" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="688" y="228" font-size="20" font-weight="700">3 Place + language</text>
<text x="688" y="282" opacity=".75">Filter by city, state</text>
<text x="688" y="306" opacity=".75">and language; look</text>
<text x="688" y="330" opacity=".75">for local cues in</text>
<text x="688" y="354" opacity=".75">posts and comments</text>
<text x="688" y="412" font-weight="700">Creator city is</text>
<text x="688" y="434" font-weight="700">a proxy</text>
<rect x="962" y="196" width="264" height="250" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="962" y="196" width="264" height="48" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="982" y="228" font-size="20" font-weight="700">4 Views + comments</text>
<text x="982" y="282" opacity=".75">Recent average views,</text>
<text x="982" y="306" opacity=".75">engagement, buyer-</text>
<text x="982" y="330" opacity=".75">like questions vs</text>
<text x="982" y="354" opacity=".75">emoji and giveaways</text>
<text x="982" y="412" font-weight="700">Insights screenshots</text>
<text x="982" y="434" font-weight="700">for finalists</text>
<rect x="1256" y="196" width="264" height="250" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1256" y="196" width="264" height="48" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1276" y="228" font-size="20" font-weight="700">5 Score</text>
<text x="1276" y="282" opacity=".75">Rate 0–3 on seven</text>
<text x="1276" y="306" opacity=".75">criteria, weight</text>
<text x="1276" y="330" opacity=".75">them, add brand</text>
<text x="1276" y="354" opacity=".75">alignment checks</text>
<text x="1276" y="412" font-weight="700">Shortlist the most</text>
<text x="1276" y="434" font-weight="700">relevant</text>
<rect x="80" y="486" width="1440" height="140" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="104" y="524" font-size="20" font-weight="700">Hypothetical: Pune women's cycling apparel brand</text>
<text x="104" y="562" opacity=".75">Creator A · 2.4 lakh followers · general fitness · 2 of 20 posts on cycling · Pune not in top cities</text>
<text x="104" y="596" font-weight="700">Creator B · 28,000 followers · women's cycling · 15 of 20 posts on cycling · Pune is top city → better fit</text>
</g>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
