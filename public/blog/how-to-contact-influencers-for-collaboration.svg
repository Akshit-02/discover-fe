<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">The influencer outreach process in six steps: research the creator, find business contact details, write a personalised message, share campaign expectations, follow up once or twice, and track every reply</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">How to contact influencers for collaboration</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Six steps from shortlist to reply, using the contact routes creators choose to share.</text>
<g fill="#202124" font-size="20">
<rect x="80" y="196" width="450" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="196" width="450" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="104" y="229" font-weight="700">1 Research the creator</text>
<text x="104" y="284" font-size="16" opacity=".75">Recent content, language, average</text>
<text x="104" y="310" font-size="16" opacity=".75">views, brand history, one specific</text>
<text x="104" y="336" font-size="16" opacity=".75">post to mention</text>
<rect x="575" y="196" width="450" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="575" y="196" width="450" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="599" y="229" font-weight="700">2 Find business contacts</text>
<text x="599" y="284" font-size="16" opacity=".75">Profile email button, bio, link page,</text>
<text x="599" y="310" font-size="16" opacity=".75">media kit, manager. No guessing,</text>
<text x="599" y="336" font-size="16" opacity=".75">no scraped lists</text>
<rect x="1070" y="196" width="450" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1070" y="196" width="450" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1094" y="229" font-weight="700">3 Write a personal message</text>
<text x="1094" y="284" font-size="16" opacity=".75">Who you are, why them, the offer</text>
<text x="1094" y="310" font-size="16" opacity=".75">(gifted or paid), timing and one</text>
<text x="1094" y="336" font-size="16" opacity=".75">clear next step</text>
<rect x="80" y="420" width="450" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="104" y="462" font-weight="700">4 Share expectations</text>
<text x="104" y="500" font-size="16" opacity=".75">One-page brief: deliverables, dates,</text>
<text x="104" y="526" font-size="16" opacity=".75">budget band, usage rights,</text>
<text x="104" y="552" font-size="16" opacity=".75">exclusivity, disclosure</text>
<rect x="575" y="420" width="450" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="599" y="462" font-weight="700">5 Follow up once or twice</text>
<text x="599" y="500" font-size="16" opacity=".75">Same thread, 4-5 working days, then</text>
<text x="599" y="526" font-size="16" opacity=".75">about a week. Make "no thanks"</text>
<text x="599" y="552" font-size="16" opacity=".75">easy, then stop</text>
<rect x="1070" y="420" width="450" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="2"/>
<text x="1094" y="462" font-weight="700">6 Track every reply</text>
<text x="1094" y="500" font-size="16" opacity=".75">Status, dates, quotes, owner and</text>
<text x="1094" y="526" font-size="16" opacity=".75">opt-outs in one shared tracker</text>
<text x="1094" y="552" font-size="16" opacity=".75">with restricted access</text>
</g>
<g stroke="#202124" stroke-width="3" fill="none">
<path d="M534 291h36M1029 291h36"/>
<path d="M534 515h36M1029 515h36"/>
</g>
<text x="80" y="668" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
