<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Six-step influencer seeding workflow: set one objective, select relevant creators, ask before sending and collect addresses with consent, pack the PR kit with a note card and disclosure reminder, ship and track deliveries, then measure mentions, content and usable UGC and delete addresses</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Running an influencer seeding campaign</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Six steps from the first opt-in message to measuring earned content.</text>
<g fill="#202124" font-size="20">
<rect x="80" y="200" width="440" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="200" width="440" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="100" y="233" font-weight="700">1 Set one objective</text>
<text x="100" y="290" font-size="17" opacity=".75">Awareness, content, feedback</text>
<text x="100" y="316" font-size="17" opacity=".75">or relationships. No sales</text>
<text x="100" y="342" font-size="17" opacity=".75">target for pure seeding.</text>
<rect x="580" y="200" width="440" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="580" y="200" width="440" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="600" y="233" font-weight="700">2 Select relevant creators</text>
<text x="600" y="290" font-size="17" opacity=".75">Niche, city, language, recent</text>
<text x="600" y="316" font-size="17" opacity=".75">views. Would they really use</text>
<text x="600" y="342" font-size="17" opacity=".75">the product?</text>
<rect x="1080" y="200" width="440" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1080" y="200" width="440" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1100" y="233" font-weight="700">3 Ask before sending</text>
<text x="1100" y="290" font-size="17" opacity=".75">Opt-in message, no obligation.</text>
<text x="1100" y="316" font-size="17" opacity=".75">Collect only the address the</text>
<text x="1100" y="342" font-size="17" opacity=".75">courier needs, with consent.</text>
<rect x="80" y="430" width="440" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="430" width="440" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="100" y="463" font-weight="700">4 Pack the PR kit</text>
<text x="100" y="520" font-size="17" opacity=".75">Hero product, inserts, note card</text>
<text x="100" y="546" font-size="17" opacity=".75">with facts and a disclosure</text>
<text x="100" y="572" font-size="17" opacity=".75">reminder, less packaging.</text>
<rect x="580" y="430" width="440" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="580" y="430" width="440" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="600" y="463" font-weight="700">5 Ship and track</text>
<text x="600" y="520" font-size="17" opacity=".75">Pin-code check, prepaid only,</text>
<text x="600" y="546" font-size="17" opacity=".75">fragile and heat care, tracking,</text>
<text x="600" y="572" font-size="17" opacity=".75">festive and monsoon buffers.</text>
<rect x="1080" y="430" width="440" height="190" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1080" y="430" width="440" height="50" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1100" y="463" font-weight="700">6 Measure and clean up</text>
<text x="1100" y="520" font-size="17" opacity=".75">Mentions, content pieces, usable</text>
<text x="1100" y="546" font-size="17" opacity=".75">UGC with permission, paid</text>
<text x="1100" y="572" font-size="17" opacity=".75">partners. Delete addresses.</text>
</g>
<g stroke="#202124" stroke-width="3" fill="none">
<path d="M524 295 H572 M564 287 L572 295 L564 303"/>
<path d="M1024 295 H1072 M1064 287 L1072 295 L1064 303"/>
<path d="M524 525 H572 M564 517 L572 525 L564 533"/>
<path d="M1024 525 H1072 M1064 517 L1072 525 L1064 533"/>
</g>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
