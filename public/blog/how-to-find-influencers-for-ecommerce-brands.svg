<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Ecommerce creator workflow in five steps: pick a creator-friendly product, find niche creators, check product-audience fit, set up a unique discount code and UTM link per creator, then track visits and orders and rebook the creators who work</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Finding influencers for your ecommerce brand</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Five steps from the right product to tracked orders and repeat creators.</text>
<g fill="#202124" font-size="20">
<rect x="80" y="200" width="264" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="200" width="264" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="100" y="234" font-weight="700">1 Pick product</text>
<text x="100" y="292" font-size="16" opacity=".75">Demonstrable</text>
<text x="100" y="316" font-size="16" opacity=".75">Visual on camera</text>
<text x="100" y="340" font-size="16" opacity=".75">Easy to gift</text>
<text x="100" y="380" font-size="16" opacity=".75">Margin left after code,</text>
<text x="100" y="404" font-size="16" opacity=".75">fees and returns</text>
<rect x="374" y="200" width="264" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="374" y="200" width="264" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="394" y="234" font-weight="700">2 Find creators</text>
<text x="394" y="292" font-size="16" opacity=".75">Customers and</text>
<text x="394" y="316" font-size="16" opacity=".75">competitor tags</text>
<text x="394" y="356" font-size="16" opacity=".75">Product niche, city,</text>
<text x="394" y="380" font-size="16" opacity=".75">language, followers,</text>
<text x="394" y="404" font-size="16" opacity=".75">engagement</text>
<rect x="668" y="200" width="264" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="668" y="200" width="264" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="688" y="234" font-weight="700">3 Check fit</text>
<text x="688" y="292" font-size="16" opacity=".75">Comments ask for</text>
<text x="688" y="316" font-size="16" opacity=".75">link, price, shade</text>
<text x="688" y="356" font-size="16" opacity=".75">Similar price band</text>
<text x="688" y="396" font-size="16" opacity=".75">Insights: top cities,</text>
<text x="688" y="420" font-size="16" opacity=".75">age, gender</text>
<rect x="962" y="200" width="264" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="962" y="200" width="264" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="982" y="234" font-weight="700">4 Code + UTM</text>
<text x="982" y="292" font-size="16" opacity=".75">One code per creator</text>
<text x="982" y="316" font-size="16" opacity=".75">Usage limit, end date</text>
<text x="982" y="356" font-size="16" opacity=".75">utm_source=instagram</text>
<text x="982" y="380" font-size="16" opacity=".75">utm_medium=influencer</text>
<text x="982" y="404" font-size="16" opacity=".75">utm_content=handle</text>
<rect x="1256" y="200" width="264" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1256" y="200" width="264" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1276" y="234" font-weight="700">5 Track, rebook</text>
<text x="1276" y="292" font-size="16" opacity=".75">Visits and orders</text>
<text x="1276" y="316" font-size="16" opacity=".75">per creator</text>
<text x="1276" y="356" font-size="16" opacity=".75">Delivered, not placed</text>
<text x="1276" y="380" font-size="16" opacity=".75">(COD returns)</text>
<text x="1276" y="420" font-size="16" opacity=".75">Rebook top performers</text>
</g>
<g stroke="#202124" stroke-width="3" fill="none">
<path d="M346 350h26M640 350h26M934 350h26M1228 350h26"/>
