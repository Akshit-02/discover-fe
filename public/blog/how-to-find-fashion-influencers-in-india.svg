<text x="394" y="234" font-weight="700">2 Search</text>
<text x="394" y="292" font-size="16" opacity=".75">Hashtags and</text>
<text x="394" y="316" font-size="16" opacity=".75">competitor tags</text>
<text x="394" y="356" font-size="16" opacity=".75">Filter by city,</text>
<text x="394" y="380" font-size="16" opacity=".75">language, niche,</text>
<text x="394" y="404" font-size="16" opacity=".75">followers, engagement</text>
<rect x="668" y="200" width="264" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
