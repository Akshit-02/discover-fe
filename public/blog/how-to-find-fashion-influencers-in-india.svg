<text x="100" y="234" font-weight="700">1 Niche and look</text>
<text x="100" y="292" font-size="16" opacity=".75">Ethnic, streetwear,</text>
<text x="100" y="316" font-size="16" opacity=".75">luxury, value, menswear,</text>
<text x="100" y="340" font-size="16" opacity=".75">accessories</text>
<text x="100" y="380" font-size="16" opacity=".75">Aesthetic, price band,</text>
<text x="100" y="404" font-size="16" opacity=".75">size range</text>
