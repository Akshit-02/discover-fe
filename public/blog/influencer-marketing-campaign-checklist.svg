<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">An influencer marketing campaign checklist in three phases: before (objectives, budget, creator shortlist, agreements, briefs), during (product delivery, content review, disclosures, publication tracking) and after (insights screenshots, performance, content rights, learnings, final report)</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">The influencer campaign checklist</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">25 steps in three phases. Each one is done when its output exists.</text>
<g fill="#202124" font-size="18">
<rect x="80" y="186" width="456" height="456" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="186" width="456" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="104" y="222" font-size="20" font-weight="700">BEFORE · steps 1–11</text>
<rect x="104" y="271" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="286">One objective, one number</text>
<rect x="104" y="311" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="326">Budget approved by finance</text>
<rect x="104" y="351" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="366">Audience and platforms</text>
<rect x="104" y="391" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="406">Creator requirements</text>
<rect x="104" y="431" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="446">Shortlist and evaluate</text>
<rect x="104" y="471" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="486">Contact and negotiate</text>
<rect x="104" y="511" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="526">Agreements signed</text>
<rect x="104" y="551" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="132" y="566">Briefs sent and confirmed</text>
<text x="104" y="616" font-size="16" opacity=".65">Weeks 1–5</text>
<rect x="572" y="186" width="456" height="456" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="572" y="186" width="456" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="596" y="222" font-size="20" font-weight="700">DURING · steps 12–18</text>
<rect x="596" y="271" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="286">Product kits delivered</text>
<rect x="596" y="311" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="326">Guidelines, links, codes</text>
<rect x="596" y="351" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="366">Drafts reviewed vs brief</text>
<rect x="596" y="391" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="406">One approver signs off</text>
<rect x="596" y="431" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="446">ASCI disclosure checked</text>
<rect x="596" y="471" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="486">Go-lives verified, logged</text>
<rect x="596" y="511" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="526">Stories screenshotted</text>
<rect x="596" y="551" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="624" y="566">First 72 hours monitored</text>
<text x="596" y="616" font-size="16" opacity=".65">Weeks 5–8</text>
<rect x="1064" y="186" width="456" height="456" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1064" y="186" width="456" height="56" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1088" y="222" font-size="20" font-weight="700">AFTER · steps 19–25</text>
<rect x="1088" y="271" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="286">Insights screenshots in</text>
<rect x="1088" y="311" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="326">Metrics in one sheet</text>
<rect x="1088" y="351" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="366">Results vs objective</text>
<rect x="1088" y="391" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="406">Rights and expiry dates</text>
<rect x="1088" y="431" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="446">Learnings documented</text>
<rect x="1088" y="471" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="486">Repeat creators picked</text>
<rect x="1088" y="511" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="526">Final report shared</text>
<rect x="1088" y="551" width="16" height="16" fill="none" stroke="#F36B4A" stroke-width="2.5"/><text x="1116" y="566">Payments closed</text>
<text x="1088" y="616" font-size="16" opacity=".65">Week 9</text>
</g>
<path d="M540 414h28M1032 414h28" stroke="#202124" stroke-width="3"/>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
