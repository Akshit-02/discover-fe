<text x="104" y="568" font-size="18" font-weight="700">DPDP Act 2023, section 9: verifiable parental consent before processing a child's personal data.</text>
<text x="104" y="598" opacity=".75">A child is anyone under 18. No tracking, behavioural monitoring or targeted advertising directed at children.</text>
