<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Four-step process for finding beauty influencers in India: define product fit by skin type, skin tone, hair type, climate, price and language; discover creators by niche and content type; vet average views, content quality and sponsored posts; then shortlist with a claims check, keeping cosmetic claims to cleansing, beautifying and appearance rather than treating or curing</title>
<rect width="1600" height="700" fill="#FFF7F1"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#202124">Finding beauty creators who fit the product</text>
<text x="80" y="144" font-size="20" fill="#202124" opacity=".65">Match skin, shade, hair, climate, price and language first. Then vet, shortlist and brief.</text>
<g fill="#202124" font-size="20">
<rect x="80" y="190" width="332" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="80" y="190" width="332" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="102" y="224" font-weight="700">1 Define fit</text>
<text x="102" y="282" font-size="17" opacity=".8">Skin type</text>
<text x="102" y="314" font-size="17" opacity=".8">Skin tone and shade range</text>
<text x="102" y="346" font-size="17" opacity=".8">Hair type</text>
<text x="102" y="378" font-size="17" opacity=".8">Climate and city</text>
<text x="102" y="410" font-size="17" opacity=".8">Price point</text>
<text x="102" y="442" font-size="17" opacity=".8">Language</text>
<rect x="450" y="190" width="332" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="450" y="190" width="332" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="472" y="224" font-weight="700">2 Discover</text>
<text x="472" y="282" font-size="17" opacity=".8">Routines, swatches, reviews</text>
<text x="472" y="314" font-size="17" opacity=".8">English and regional searches</text>
<text x="472" y="346" font-size="17" opacity=".8">Creators tagged by similar</text>
<text x="472" y="370" font-size="17" opacity=".8">brands</text>
<text x="472" y="402" font-size="17" opacity=".8">Filters: niche, city,</text>
<text x="472" y="426" font-size="17" opacity=".8">language, average views</text>
<rect x="820" y="190" width="332" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="820" y="190" width="332" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="842" y="224" font-weight="700">3 Vet</text>
<text x="842" y="282" font-size="17" opacity=".8">Recent average views</text>
<text x="842" y="314" font-size="17" opacity=".8">True colour, no skin filters</text>
<text x="842" y="346" font-size="17" opacity=".8">Paid posts in last 15</text>
<text x="842" y="378" font-size="17" opacity=".8">Clear "Ad" disclosure</text>
<text x="842" y="410" font-size="17" opacity=".8">Honest reviews, drawbacks</text>
<text x="842" y="442" font-size="17" opacity=".8">Insights screenshots</text>
<rect x="1190" y="190" width="330" height="300" fill="#FFFFFF" stroke="#202124" stroke-width="3"/>
<rect x="1190" y="190" width="330" height="52" fill="#F36B4A" stroke="#202124" stroke-width="3"/>
<text x="1212" y="224" font-weight="700">4 Shortlist and brief</text>
<text x="1212" y="282" font-size="17" opacity=".8">Mix creator types</text>
<text x="1212" y="314" font-size="17" opacity=".8">Right shade sent first time</text>
<text x="1212" y="346" font-size="17" opacity=".8">2 to 4 weeks of skincare use</text>
<text x="1212" y="378" font-size="17" opacity=".8">Approved claims list</text>
<text x="1212" y="410" font-size="17" opacity=".8">Two or three backups</text>
</g>
<g stroke="#202124" stroke-width="3" fill="none">
<path d="M414 340h32M440 332l8 8-8 8"/>
<path d="M784 340h32M810 332l8 8-8 8"/>
<path d="M1154 340h32M1180 332l8 8-8 8"/>
</g>
<rect x="80" y="522" width="1440" height="104" fill="#FFF7F1" stroke="#202124" stroke-width="2"/>
<text x="104" y="562" font-size="20" font-weight="700" fill="#202124">Claims guardrail</text>
<text x="104" y="598" font-size="18" fill="#202124" opacity=".8">Cosmetic claims: cleansing, beautifying, appearance, feel.  Avoid: treats, cures, heals, stops hair fall, makes you fairer.</text>
<text x="80" y="676" font-size="16" fill="#202124" opacity=".65">discover.kudozz.in</text>
</svg>
